name: Build

on:
  push:
    branches: [v0, main]
  pull_request:
    branches: [v0, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # The About view links to the exact commit the binary was built from.
  # Release builds never enable the `demo` feature of the app.
  INLET_SOURCE_REV: ${{ github.sha }}

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-windows-x86_64

      - name: Build
        run: cargo build --release --locked -p inlet

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/inlet.exe dist/inlet.exe
          cp THIRD-PARTY-NOTICES dist/THIRD-PARTY-NOTICES
          cp LICENSE dist/LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-windows-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows-screenshot:
    name: Windows screenshots (demo)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-windows-x86_64-demo

      # Demo data only: this binary is never shipped.
      - name: Build with demo data
        run: cargo build --release --locked -p inlet --features demo

      # The runner has no GPU; Direct3D falls back to WARP (software), which gpui can use.
      - name: Take screenshots
        shell: pwsh
        run: ./scripts/windows-screenshot.ps1 -Exe target/release/inlet.exe -OutDir screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-windows-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (aarch64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # gpui compiles Metal shaders at build time. Recent Xcode versions ship the
      # Metal toolchain as a separate download.
      - name: Make sure the Metal toolchain is available
        run: |
          if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-macos-aarch64

      - name: Build
        run: cargo build --release --locked -p inlet

      - name: Test
        run: cargo test --workspace --locked

      # The binary is not signed or notarised yet. On the first start Gatekeeper
      # blocks it: right-click the file and choose Open, or run
      # `xattr -d com.apple.quarantine inlet` after unzipping.
      - name: Package
        run: |
          mkdir dist
          cp target/release/inlet dist/inlet
          cp THIRD-PARTY-NOTICES dist/THIRD-PARTY-NOTICES
          cp LICENSE dist/LICENSE
          cd dist
          zip inlet-macos-aarch64.zip inlet THIRD-PARTY-NOTICES LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-macos-aarch64
          path: dist/inlet-macos-aarch64.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package list follows Zed's script/linux.
      - name: Install system packages for gpui
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang lld pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-linux-x86_64

      - name: Build
        run: cargo build --release --locked -p inlet

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The extra test CA of inlet-protocol is for tests only. The crate also
      # refuses to compile it in release mode; this checks the feature graph.
      - name: The app does not enable test-only features
        run: |
          if cargo tree --locked -p inlet -e features,no-dev | grep -F 'test-extra-ca'; then
            echo "inlet enables the test-extra-ca feature"
            exit 1
          fi

      - name: Package
        run: |
          mkdir dist
          cp target/release/inlet dist/inlet
          cp THIRD-PARTY-NOTICES dist/THIRD-PARTY-NOTICES
          cp LICENSE dist/LICENSE
          tar -czf inlet-linux-x86_64.tar.gz -C dist inlet THIRD-PARTY-NOTICES LICENSE
          mv inlet-linux-x86_64.tar.gz dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-linux-x86_64
          path: dist/inlet-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  notices:
    name: Third-party notices are up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-${{ runner.os }}-rust-1.99.1

      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --version 0.9.3 --features cli

      - name: Regenerate THIRD-PARTY-NOTICES
        run: scripts/third-party-notices.sh

      - name: Check that the committed file is current
        run: git diff --exit-code THIRD-PARTY-NOTICES

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action runs in a container without the pinned toolchain.
      - name: Drop the toolchain pin for the container
        run: rm rust-toolchain.toml

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
