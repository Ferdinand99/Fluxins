name: Build

on:
  push:
    branches: [v0, main, ci1-cache-base]
  pull_request:
    branches: [v0, main, ci1-cache-base]
  workflow_dispatch:
    inputs:
      release:
        description: Also build the optimised release binaries, as on main and tags
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: Build the optimised release binaries (release.yml)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # The About view links to the exact commit the binary was built from.
  # Release builds never enable the `demo` feature of the app.
  INLET_SOURCE_REV: ${{ github.sha }}

# Two kinds of builds:
#
# - The checks (tests, clippy, the demo builds the screenshot jobs photograph) build
#   once per job with [profile.ci] of Cargo.toml and link with rust-lld (Windows) or
#   mold (Linux). Nothing built with it is shipped.
# - The *-release jobs build the binaries that can be shipped with [profile.release]
#   and the default linkers, check them and package them: Windows and Linux on pushes
#   to v0, all three on main, on tags (release.yml) and on manual runs that ask for it.
#
# Caches: one rust-cache entry per check job (shared-key), saved only by pushes to v0.
# Pull requests restore the entry of v0 and save nothing, so the repository holds one
# entry per job (a target folder without debug info) and stays within GitHub's 10 GB
# limit. The release jobs use no cache.

jobs:
  # Pull requests that only change documentation skip every other job. A skipped job
  # counts as passed for a required check, so nothing is left waiting.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2

      # Markdown files, docs/ and the README pictures cannot change what is built or
      # tested. The other brand files are embedded in the app (icons), so they count
      # as code.
      - name: Does the change touch code?
        id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the merge commit; its first parent is the base branch.
          files=$(git diff --name-only HEAD^1 HEAD)
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *.md | docs/* | assets/brand/readme/*) echo "documentation: $f" ;;
              *) echo "code: $f"; code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo fmt --version

      - name: Formatting
        run: cargo fmt --all --check

  # The demo build that screenshots-windows photographs. The tests run next to it in
  # windows-tests.
  windows:
    name: Windows (x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C linker=rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-ci-build
          save-if: ${{ github.ref == 'refs/heads/ci1-cache-base' }}

      # Demo data only: never shipped.
      - name: Build with demo data
        shell: bash
        run: |
          cargo build --profile ci --locked -p inlet --features demo
          mkdir demo-build
          cp target/ci/inlet.exe target/ci/inlet-visual.exe demo-build/

      # The test-only extra CA must not be in any build of the app.
      - name: The demo binary has no test CA code
        shell: bash
        run: |
          if ! test -s demo-build/inlet.exe; then
            echo "demo-build/inlet.exe is missing or empty; nothing was checked"
            exit 1
          fi
          if grep -aqF INLET_TEST_EXTRA_CA_FILE demo-build/inlet.exe; then
            echo "demo-build/inlet.exe contains the test CA variable"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-demo-windows
          path: demo-build/
          if-no-files-found: error
          retention-days: 3

  windows-tests:
    name: Windows tests (x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C linker=rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-ci-test
          save-if: ${{ github.ref == 'refs/heads/ci1-cache-base' }}

      - name: Test
        run: cargo test --workspace --profile ci --locked

      # inlet-platform tests that touch the real system (registry, notification
      # area) are ignored in a plain `cargo test`; they run here.
      - name: Platform tests on the real system
        run: cargo test --profile ci --locked -p inlet-platform -- --include-ignored

      # Runs the platform demo (window, tray icon, badge, notification) and keeps a
      # screenshot. It fails if the tray icon could not be created or gpui logged a
      # borrow error (a dropped frame).
      - name: Platform demo
        shell: pwsh
        run: |
          cargo build --profile ci --locked -p inlet-platform --features gpui --example tray_demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path platform-demo | Out-Null
          $p = Start-Process -FilePath target/ci/examples/tray_demo.exe -ArgumentList '--exit-after', '15' -PassThru -RedirectStandardOutput platform-demo/windows.log
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Left, $bounds.Top, 0, 0, $bitmap.Size)
          $bitmap.Save("platform-demo/windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force }
          Get-Content platform-demo/windows.log
          if (-not (Select-String -Path platform-demo/windows.log -Pattern 'tray icon created' -Quiet)) { exit 1 }
          # The platform calls must never make gpui drop a frame.
          if (Select-String -Path platform-demo/windows.log -Pattern 'already (mutably )?borrowed' -Quiet) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-demo-windows
          path: platform-demo/
          if-no-files-found: ignore
          retention-days: 7

  windows-release:
    name: Windows release build (x86_64)
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (inputs.release
      || (github.event_name == 'push' && github.ref == 'refs/heads/v0')
      || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release --locked -p inlet

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/inlet.exe dist/inlet.exe
          cp THIRD-PARTY-NOTICES dist/THIRD-PARTY-NOTICES
          cp LICENSE dist/LICENSE

      # The test-only extra CA must not be in a shipped binary in any form.
      - name: The release binary has no test CA code
        shell: bash
        run: |
          if ! test -s dist/inlet.exe; then
            echo "dist/inlet.exe is missing or empty; nothing was checked"
            exit 1
          fi
          if grep -aqF INLET_TEST_EXTRA_CA_FILE dist/inlet.exe; then
            echo "dist/inlet.exe contains the test CA variable"
            exit 1
          fi
          # Demo data and scene files are for screenshots only.
          if grep -aqF "demo scene file" dist/inlet.exe; then
            echo "dist/inlet.exe contains demo code"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-windows-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Screenshots of the demo build: numbered runs to check by eye, and the scene files
  # of tests/visual compared with the committed baselines (inlet-visual). The runner
  # image is pinned so its fonts stay the same; the script sets the screen to
  # 1920x1080 at 100 %. A difference fails the job; the artifact visual-<os> holds the
  # screenshots, the differences and report.md. scripts/update-visual-baselines.sh
  # takes a run's screenshots as the new baselines. Uses the demo build of the Windows
  # job.
  screenshots-windows:
    name: Windows screenshots (demo)
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inlet-demo-windows
          path: demo-build

      # The runner has no GPU; Direct3D falls back to WARP (software), which gpui can use.
      - name: Take screenshots
        shell: pwsh
        run: ./scripts/windows-screenshot.ps1 -Exe demo-build/inlet.exe -OutDir screenshots

      - name: Compare with the baselines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          demo-build/inlet-visual.exe compare --scenes tests/visual/scenes \
            --actual screenshots/visual --baseline tests/visual/baseline/windows \
            --out visual-report | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: visual-windows
          path: visual-report/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when a demo crashed: the pictures show how far it got.
        if: always()
        with:
          name: inlet-windows-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 7

      # COM used on a thread that never initialised it (as gpui's own jump list did),
      # or a shell call made while gpui's app is borrowed, shows only in these logs.
      - name: No COM or borrow errors in the demo logs
        if: always()
        shell: pwsh
        run: |
          $patterns = @('CoInitialize has not been called', '0x800401F0', 'RefCell already borrowed', 'already mutably borrowed', 'jump list')
          $logs = Get-ChildItem -Recurse -Path screenshots -Filter *.log
          $bad = $logs | Select-String -Pattern $patterns -SimpleMatch
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error::$($_.Filename): $($_.Line)" }
            exit 1
          }
          # Every demo run and scene must have left its log, or the check above saw too
          # little.
          $runs = (Select-String -Path scripts/windows-screenshot.ps1 -Pattern '^Run-Demo ').Count
          $runs += (Get-ChildItem tests/visual/scenes/*.toml).Count
          if ($logs.Count -lt $runs) {
            Write-Host "::error::only $($logs.Count) demo logs for $runs demo runs"
            exit 1
          }
          Write-Host "no COM or borrow errors in $($logs.Count) logs ($runs demo runs)"

  # Pinned like screenshots-macos: the demo build made here is photographed there, and
  # a new Xcode or Metal compiler could move pixels. The macOS screenshots are quick,
  # so the tests stay in this job.
  macos:
    name: macOS (aarch64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # gpui compiles Metal shaders at build time. Recent Xcode versions ship the
      # Metal toolchain as a separate download.
      - name: Make sure the Metal toolchain is available
        run: |
          if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-ci
          save-if: ${{ github.ref == 'refs/heads/ci1-cache-base' }}

      # Demo data only: never shipped. Built first, so the screenshots job gets it as
      # early as possible.
      - name: Build with demo data
        run: |
          cargo build --profile ci --locked -p inlet --features demo
          mkdir demo-build
          cp target/ci/inlet target/ci/inlet-visual demo-build/

      # The test-only extra CA must not be in any build of the app.
      - name: The demo binary has no test CA code
        run: |
          if ! test -s demo-build/inlet; then
            echo "demo-build/inlet is missing or empty; nothing was checked"
            exit 1
          fi
          if grep -aqF INLET_TEST_EXTRA_CA_FILE demo-build/inlet; then
            echo "demo-build/inlet contains the test CA variable"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-demo-macos
          path: demo-build/
          if-no-files-found: error
          retention-days: 3

      - name: Test
        run: cargo test --workspace --profile ci --locked

      # inlet-platform tests that touch the real system (LaunchAgents, pipes) are
      # ignored in a plain `cargo test`; they run here.
      - name: Platform tests on the real system
        run: cargo test --profile ci --locked -p inlet-platform -- --include-ignored

      # The menu bar only accepts a status item from the main thread, which test
      # threads are not, so the tray is checked with the demo. It fails if the
      # tray icon could not be created.
      - name: Platform demo
        run: |
          cargo build --profile ci --locked -p inlet-platform --features gpui --example tray_demo
          mkdir -p platform-demo
          ./target/ci/examples/tray_demo --exit-after 15 > platform-demo/macos.log 2>&1 &
          pid=$!
          sleep 8
          screencapture -x platform-demo/macos.png || echo "no screenshot"
          wait "$pid" || true
          cat platform-demo/macos.log
          grep -q 'tray icon created' platform-demo/macos.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-demo-macos
          path: platform-demo/
          if-no-files-found: ignore
          retention-days: 7

  macos-release:
    name: macOS release build (aarch64)
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (inputs.release
      || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # gpui compiles Metal shaders at build time. Recent Xcode versions ship the
      # Metal toolchain as a separate download.
      - name: Make sure the Metal toolchain is available
        run: |
          if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Build
        run: cargo build --release --locked -p inlet

      # The binary is not signed or notarised yet. On the first start Gatekeeper
      # blocks it: right-click the file and choose Open, or run
      # `xattr -d com.apple.quarantine inlet` after unzipping.
      - name: Package
        run: |
          mkdir dist
          cp target/release/inlet dist/inlet
          cp THIRD-PARTY-NOTICES dist/THIRD-PARTY-NOTICES
          cp LICENSE dist/LICENSE
          cd dist
          zip inlet-macos-aarch64.zip inlet THIRD-PARTY-NOTICES LICENSE

      # The test-only extra CA must not be in a shipped binary in any form.
      - name: The release binary has no test CA code
        run: |
          if ! test -s dist/inlet; then
            echo "dist/inlet is missing or empty; nothing was checked"
            exit 1
          fi
          if grep -aqF INLET_TEST_EXTRA_CA_FILE dist/inlet; then
            echo "dist/inlet contains the test CA variable"
            exit 1
          fi
          # Demo data and scene files are for screenshots only.
          if grep -aqF "demo scene file" dist/inlet; then
            echo "dist/inlet contains demo code"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-macos-aarch64
          path: dist/inlet-macos-aarch64.zip
          if-no-files-found: error
          retention-days: 7

      # Unsigned Inlet.app. On tags, release.yml hands it to macos-sign.yml,
      # which signs and notarises it. The tarball keeps the file modes.
      - name: Assemble Inlet.app
        run: |
          packaging/macos/build-app.sh dist/inlet dist-app
          tar -czf inlet-macos-aarch64-app.tar.gz -C dist-app Inlet.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-macos-aarch64-app
          path: inlet-macos-aarch64-app.tar.gz
          if-no-files-found: error
          retention-days: 7

  # See screenshots-windows. Uses the demo build of the macOS job; the script sets the
  # screen to 1920x1080 at one pixel per point.
  screenshots-macos:
    name: macOS screenshots (demo)
    needs: macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inlet-demo-macos
          path: demo-build

      - name: Take screenshots
        run: |
          chmod +x demo-build/inlet demo-build/inlet-visual
          scripts/macos-screenshot.sh demo-build/inlet screenshots

      - name: Compare with the baselines
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          demo-build/inlet-visual compare --scenes tests/visual/scenes \
            --actual screenshots/visual --baseline tests/visual/baseline/macos \
            --out visual-report --title-bar | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs with the report
        if: ${{ !cancelled() }}
        run: mkdir -p visual-report && cp screenshots/visual/*.log visual-report/ 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: visual-macos
          path: visual-report/
          if-no-files-found: ignore
          retention-days: 14

  # The app with and without demo data. The build without it gets the checks of a
  # shipped binary on every change; the demo build is photographed by
  # screenshots-linux. The tests and clippy run next to it in linux-tests.
  linux:
    name: Linux (x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package list follows Zed's script/linux.
      - name: Install system packages for gpui
        # A mirror that does not answer fails the step instead of hanging the job.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential cmake clang lld mold pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-ci-build
          save-if: ${{ github.ref == 'refs/heads/ci1-cache-base' }}

      # The extra test CA of inlet-protocol is for tests only. The crate also
      # refuses to compile it in release mode; this checks the feature graph.
      - name: The app does not enable test-only features
        run: |
          if cargo tree --locked -p inlet -e features,no-dev | grep -F 'test-extra-ca'; then
            echo "inlet enables the test-extra-ca feature"
            exit 1
          fi

      - name: Build
        run: cargo build --profile ci --locked -p inlet

      # And the binary holds none of its code, whatever the profile says.
      - name: The binary has no test CA code
        run: |
          if ! test -s target/ci/inlet; then
            echo "target/ci/inlet is missing or empty; nothing was checked"
            exit 1
          fi
          if grep -aqF INLET_TEST_EXTRA_CA_FILE target/ci/inlet; then
            echo "target/ci/inlet contains the test CA variable"
            exit 1
          fi
          # Demo data and scene files are for screenshots only.
          if grep -aqF "demo scene file" target/ci/inlet; then
            echo "target/ci/inlet contains demo code"
            exit 1
          fi

      # Demo data only: never shipped. Only the app crate is compiled again.
      - name: Build with demo data
        run: |
          cargo build --profile ci --locked -p inlet --features demo
          mkdir demo-build
          cp target/ci/inlet target/ci/inlet-visual demo-build/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-demo-linux
          path: demo-build/
          if-no-files-found: error
          retention-days: 3

  linux-tests:
    name: Linux tests and clippy (x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package list follows Zed's script/linux.
      - name: Install system packages for gpui
        # A mirror that does not answer fails the step instead of hanging the job.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential cmake clang lld mold pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-ci-test
          save-if: ${{ github.ref == 'refs/heads/ci1-cache-base' }}

      - name: Test
        run: cargo test --workspace --profile ci --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings

      # The layout measures (rail, sidebar, headers, rows, message grid, composer) are
      # taken from the real view with the demo data, so they need the demo feature; so
      # do the demo's own tests and the screenshot comparison tool.
      - name: Layout tests and demo tests
        run: cargo test --profile ci --locked -p inlet --features demo --lib --bins --test layout_metrics

      - name: Clippy with demo data
        run: cargo clippy --profile ci --locked -p inlet --features demo --all-targets -- -D warnings

      # The tray test needs a session bus to register on. The gpui glue and the
      # demo are behind a feature, so they are linted here separately.
      - name: Platform tests with a session bus
        run: |
          dbus-run-session -- cargo test --profile ci --locked -p inlet-platform
          cargo clippy --profile ci --locked -p inlet-platform --features gpui --all-targets -- -D warnings

  linux-release:
    name: Linux release build (x86_64)
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (inputs.release
      || (github.event_name == 'push' && github.ref == 'refs/heads/v0')
      || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package list follows Zed's script/linux.
      - name: Install system packages for gpui
        # A mirror that does not answer fails the step instead of hanging the job.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            build-essential cmake clang lld pkg-config \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release --locked -p inlet

      - name: Package
        run: |
          mkdir dist
          cp target/release/inlet dist/inlet
          cp THIRD-PARTY-NOTICES dist/THIRD-PARTY-NOTICES
          cp LICENSE dist/LICENSE

      # The test-only extra CA must not be in a shipped binary in any form.
      - name: The release binary has no test CA code
        run: |
          if ! test -s dist/inlet; then
            echo "dist/inlet is missing or empty; nothing was checked"
            exit 1
          fi
          if grep -aqF INLET_TEST_EXTRA_CA_FILE dist/inlet; then
            echo "dist/inlet contains the test CA variable"
            exit 1
          fi
          # Demo data and scene files are for screenshots only.
          if grep -aqF "demo scene file" dist/inlet; then
            echo "dist/inlet contains demo code"
            exit 1
          fi
          tar -czf dist/inlet-linux-x86_64.tar.gz -C dist inlet THIRD-PARTY-NOTICES LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inlet-linux-x86_64
          path: dist/inlet-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # See screenshots-windows. Uses the demo build of the Linux job, under Xvfb with
  # software Vulkan (lavapipe) at 96 DPI and a scale of 1.
  screenshots-linux:
    name: Linux screenshots (demo)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Xvfb, software Vulkan and the capture tools
        # A mirror that does not answer fails the step instead of hanging the job.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            xvfb x11-utils imagemagick xdotool \
            libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb1 libx11-xcb1 libwayland-client0 libfontconfig1 \
            libasound2t64 \
            fonts-noto-cjk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inlet-demo-linux
          path: demo-build

      - name: Take screenshots
        run: |
          set -o pipefail
          chmod +x demo-build/inlet demo-build/inlet-visual
          mkdir screenshots
          scripts/xvfb-screens.sh demo-build/inlet | tar -x -C screenshots

      - name: Compare with the baselines
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          demo-build/inlet-visual compare --scenes tests/visual/scenes \
            --actual screenshots/visual --baseline tests/visual/baseline/linux \
            --out visual-report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs with the report
        if: ${{ !cancelled() }}
        run: mkdir -p visual-report && cp screenshots/visual/*.log visual-report/ 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: visual-linux
          path: visual-report/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when a demo crashed: the pictures show how far it got.
        if: always()
        with:
          name: inlet-linux-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  notices:
    name: Third-party notices are up to date
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # The released cargo-about binary, checked against the hash in the action's
      # manifest, instead of compiling it.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.3

      - name: Regenerate THIRD-PARTY-NOTICES
        run: scripts/third-party-notices.sh

      - name: Check that the committed file is current
        run: git diff --exit-code THIRD-PARTY-NOTICES

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action runs in a container without the pinned toolchain.
      - name: Drop the toolchain pin for the container
        run: rm rust-toolchain.toml

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

      # The fuzz target of inlet-media is a workspace of its own, with its own lock.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: crates/inlet-media/fuzz/Cargo.toml
          command: check
          arguments: --all-features --locked

      - name: The fuzz lock uses the decoder versions of the main lock
        run: scripts/check-fuzz-lock.sh

  fuzz-build:
    name: Fuzz target builds (inlet-media)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libFuzzer and the address sanitizer need nightly. Only this job uses it.
      - name: Install the nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version

      - name: Cache cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-fuzz
          workspaces: crates/inlet-media/fuzz
          save-if: ${{ github.ref == 'refs/heads/ci1-cache-base' }}

      # Builds the target with libFuzzer and the sanitizer, and does not run it.
      - name: Build the fuzz target
        working-directory: crates/inlet-media
        run: cargo +nightly fuzz build
