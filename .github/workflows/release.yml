name: Release

# Pushing a tag that starts with "v" builds Inlet on all three platforms and
# creates a GitHub Release. Releases are always marked as pre-releases while
# the version starts with 0 or has a pre-release suffix, and are never "latest".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/inlet-windows-x86_64/inlet.exe release/inlet-windows-x86_64.exe
          cp artifacts/inlet-macos-aarch64/inlet-macos-aarch64.zip release/
          cp artifacts/inlet-linux-x86_64/inlet-linux-x86_64.tar.gz release/
          # Third-party licence notices, if the repository carries them.
          for f in THIRD-PARTY-NOTICES*; do
            if [ -f "$f" ]; then cp "$f" release/; fi
          done
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          **Beta, not stable.** Expect bugs and missing features. Do not rely on Inlet for anything important yet.

          Inlet works with Fluxer, an independent project that is not made or endorsed by Fluxer Platform AB. "Fluxer" is their trademark.

          ## Downloads

          - Windows (x86_64): `inlet-windows-x86_64.exe`. The file is not code-signed, so Windows SmartScreen may warn you. Choose "More info", then "Run anyway".
          - macOS (Apple silicon): `inlet-macos-aarch64.zip`. The app is not signed yet, so Gatekeeper blocks it on first start. Unzip, then right-click the file and choose Open. If that does not work, run `xattr -d com.apple.quarantine inlet` in a terminal.
          - Linux (x86_64): `inlet-linux-x86_64.tar.gz`.

          Check the downloads against `SHA256SUMS.txt`. Licence notices for third-party code are in the `THIRD-PARTY-NOTICES` file when it is attached.
          NOTES

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Every v0.* tag and every tag with a suffix (v1.0.0-beta.1) is a pre-release.
          # Nothing is ever marked as the latest release.
          prerelease=false
          case "$TAG" in
            v0.*|*-*) prerelease=true ;;
          esac
          flags=(--latest=false)
          if [ "$prerelease" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Inlet $TAG (beta)" \
            --notes-file notes.md \
            "${flags[@]}"
