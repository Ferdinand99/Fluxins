[package]
name = "inlet"
description = "A native desktop client that works with Fluxer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Built-in sample data, started with INLET_DEMO=1. Only for screenshots and UI checks;
# off in normal builds.
demo = ["dep:image-webp"]
# Trust the private test instance's CA (REST, gateway and media). Debug builds only:
# inlet-protocol refuses it in a release build.
test-extra-ca = ["inlet-protocol/test-extra-ca"]

[[bin]]
name = "inlet"
path = "src/main.rs"

[dependencies]
inlet-editor = { path = "../inlet-editor" }
inlet-emoji = { path = "../inlet-emoji" }
inlet-protocol = { path = "../inlet-protocol" }
# Per-account client state: the message windows the chat shows.
inlet-state = { path = "../inlet-state" }
# Images: fetched from the media proxy, decoded and cached with hard limits.
inlet-media = { path = "../inlet-media" }
# Tray, badge, single instance, deep links, autostart (with its gpui glue).
inlet-platform = { path = "../inlet-platform", features = ["gpui"] }

gpui.workspace = true
gpui_platform.workspace = true
# Fluxer's own markdown parser (AGPL-3.0-or-later, like Inlet), pinned to a commit.
fluxer_markdown_parser = { git = "https://github.com/fluxerapp/fluxer", rev = "f1cba64e64bda5f57ad3cf827c1d5a98ecdd80df" }

anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger = "0.11"
# The text catalogue (Project Fluent): `src/i18n.rs`, `locales/`.
fluent-bundle = "0.16"
futures = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
log = "0.4"
# The media proxy client (images, saved files): no cookies, no token, no redirects.
# Also gives the `Method` of `inlet_protocol::Client::request_json`. Same version and
# TLS stack as inlet-protocol.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Code block highlighting: the parser and grammars only, with the pure-Rust regex engine.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# The system locale, for the date and time format in the chat.
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
unic-langid = "0.9"
unicode-segmentation = "1"
url = "2"
zeroize = "1"
# Writes the WebP pictures of the demo stickers (demo builds only; already used by
# inlet-media to read WebP).
image-webp = { version = "0.2", optional = true }

[dev-dependencies]
# gpui's test platform, for the composer's key handling tests.
gpui = { workspace = true, features = ["test-support"] }
# Mock server for the acknowledgement, settings and composer send tests.
wiremock = "0.6"
# A mock gateway (WebSocket) for the background account test; the versions the
# protocol crate already uses.
tokio = { version = "1", features = ["net", "test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# Reads the catalogue files in the i18n tests (same version fluent-bundle uses).
fluent-syntax = "0.12"
# Writes WebP test pictures (stickers).
image-webp = "0.2"

# Plays the notification sound (Inlet's own, assets/sounds) on the default output
# device: WASAPI and CoreAudio through cpal. On Linux, ALSA is loaded at run time
# (libloading), so a system without libasound still starts, only without sound.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# Decodes the built-in window icon (X11). gpui already depends on image 0.25.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Embeds the app icon and version info in inlet.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
