# cargo-about configuration for THIRD-PARTY-NOTICES.
# Generate with scripts/third-party-notices.sh.
accepted = [
    "AGPL-3.0-or-later",
    "AGPL-3.0",
    "GPL-3.0-or-later",
    "GPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "NCSA",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "Unlicense",
    "bzip2-1.0.6",
]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]
