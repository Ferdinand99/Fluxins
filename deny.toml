# cargo-deny configuration: licences, advisories and sources.
# Inlet is AGPL-3.0-or-later, so every dependency licence must be compatible with it.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on directly; gpui pulls in several
# unmaintained transitive crates that are not ours to fix.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "NCSA",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# gpui and its platform crates come from Zed's repository at a pinned revision,
# together with a few forks Zed patches in; wgpu is pulled in by gpui from git, and
# Fluxer's markdown parser is a git dependency. Nothing else may come from git.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/async-task",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/khronos-egl",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs",
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/fluxerapp/fluxer",
]
